[project]
name = "canvodpy-demo"
version = "0.1.0"
description = "Interactive marimo notebooks for the canVODpy GNSS-T VOD retrieval ecosystem"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
dependencies = [
    # No canvodpy here: each notebook pins its canvod* packages from PyPI in
    # its own PEP 723 header, and `marimo edit --sandbox` installs them.
    "marimo>=0.23.9",
]

[project.urls]
Homepage = "https://github.com/TUW-GEO/canvodpy-demo"
Repository = "https://github.com/TUW-GEO/canvodpy-demo"
"Bug Tracker" = "https://github.com/TUW-GEO/canvodpy/issues"
Documentation = "https://canvodpy.eu/"
